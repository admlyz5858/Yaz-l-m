# Standalone yükleme: JS + asset’ler APK içine gömülür (Metro gerekmez).
# Debug (assembleDebug) varsayılan olarak bundle’ı atlar; cihazda Metro olmadan splash’te kalır.
name: Android release APK

on:
  push:
    branches:
      - main
      - 'cursor/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK (Expo / RN 0.83)
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JS dependencies
        run: npm ci

      - name: Assemble release APK (embedded JS bundle)
        env:
          NODE_ENV: production
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
