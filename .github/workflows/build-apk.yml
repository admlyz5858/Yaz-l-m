# ZekaAkademi - Android APK Build
# Her push/PR'da GitHub Actions ile APK derlenir.
# APK: Actions sekmesi → Son workflow run → Artifacts → zeka-akademi-apk indir

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/uygulama-mimarisi-tasla-bc32
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: zeka_akademi/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: zeka_akademi
        run: npm ci

      - name: Prebuild Android
        working-directory: zeka_akademi
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Release APK (JS bundle gömülü)
        working-directory: zeka_akademi/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeka-akademi-apk
          path: zeka_akademi/android/app/build/outputs/apk/release/app-release.apk
